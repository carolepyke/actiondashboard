                      <div className="home-card-open">Open project <span>→</span></div>
                      <button onClick={e=>{e.stopPropagation();deleteProject(proj.id,e);}}
                        style={{position:"absolute",top:10,right:10,background:"none",border:"1px solid var(--border)",borderRadius:6,padding:"3px 8px",fontSize:12,color:"var(--muted)",cursor:"pointer",fontFamily:"'Jost',sans-serif",transition:"all 0.15s"}}
                        onMouseOver={e=>{e.currentTarget.style.borderColor="#C0392B";e.currentTarget.style.color="#C0392B";}}
                        onMouseOut={e=>{e.currentTarget.style.borderColor="var(--border)";e.currentTarget.style.color="var(--muted)";}}>
                        🗑️
                      </button>
                    </div>
                  );
                })}
                <div className="home-create-card" onClick={()=>setShowNewProj(true)} style={{animationDelay:`${projects.length*0.07}s`}}>
                  <div className="home-create-icon">＋</div>
                  <div className="home-create-label">New project</div>
                </div>
              </div>
            </div>
          )
        ) : (
          <>
            {/* Header */}
            <div className="main-header">
              <div className="main-eyebrow">Words That Deliver · Action Dashboard</div>
              <div className="main-title">{activeProject.emoji} {activeProject.name}</div>
              <div className="main-sub">
                {actions.length} remaining · {done.length} completed
              </div>
              <div className="today-pill">
                <strong>Today — </strong>{PROMPTS[new Date().getDay() % PROMPTS.length]}
              </div>
            </div>

            {/* ── PROJECT GOAL ── */}
            <div className="project-goal-wrap">
              <div className="goal-eyebrow">🎯 Project Goal</div>
              {editingGoal ? (
                <textarea className="goal-input"
                  autoFocus
                  value={activeProject.goal||""}
                  onChange={e=>updateGoal(e.target.value)}
                  onBlur={()=>setEditingGoal(false)}
                  placeholder="What does success look like for this project?"/>
              ) : (
                activeProject.goal
                  ? <div className="goal-text" onClick={()=>setEditingGoal(true)}>{activeProject.goal}</div>
                  : <div className="goal-empty" onClick={()=>setEditingGoal(true)}>What does success look like for this project? Click to add your goal…</div>
              )}
              {!editingGoal && <button className="goal-edit-btn" onClick={()=>setEditingGoal(true)}>✏️ edit</button>}
            </div>

            {/* Add bar — global, adds to unsectioned */}
            <div className="add-bar">
              <input value={newTitle} onChange={e=>setNewTitle(e.target.value)}
                onKeyDown={e=>e.key==="Enter"&&addAction(null)}
                placeholder="Add a new action…"/>
              <select value={newCat} onChange={e=>setNewCat(e.target.value)}>
                {CATS.map(c=><option key={c.id} value={c.id}>{c.icon} {c.label}</option>)}
              </select>
              <button onClick={()=>addAction(null)}>Add</button>
            </div>

            {/* Toolbar */}
            <div className="toolbar">
              <div className="toolbar-left" style={{display:"flex",alignItems:"center",gap:10}}>
                <span className="count-badge">{actions.length} {actions.length===1?"action":"actions"} remaining</span>
                <div style={{position:"relative"}}>
                  <button className="print-btn" onClick={()=>setShowPrintMenu(p=>!p)}>🖨️ Print</button>
                  {showPrintMenu && (
                    <div className="ctx-menu" style={{top:"110%",left:0,minWidth:200}} onClick={e=>e.stopPropagation()}>
                      <div className="ctx-item" onClick={printProject}>📋 Full project list</div>
                      <div className="ctx-item" onClick={printToday}>📅 Today's items only</div>
                    </div>
                  )}
                </div>
              </div>
              <div className="view-toggle">
                <button className={`view-btn${view==="visual"?" active":""}`} onClick={()=>setView("visual")}>▦ Visual</button>
                <button className={`view-btn${view==="list"?" active":""}`} onClick={()=>setView("list")}>☰ List</button>
                <button className={`view-btn${view==="calendar"?" active":""}`} onClick={()=>setView("calendar")}>📅 Calendar</button>
              </div>
            </div>

            {/* ── VISUAL & LIST views — section-aware ── */}
            {(view==="visual"||view==="list") && (() => {
              const notesProps = (a) => ({
                a, sections, currentUser, team: TEAM,
                onNote: updateNote, onDate: updateDate,
                onBullet: addBullet, onBulletUpdate: updateBullet,
                onBulletDelete: deleteBullet, onBulletKey: bulletKeyDown,
                onBulletToggle: toggleBullet,
                onAssign: assignAction,
                linkDraft: getLinkDraft(a.id),
                onLinkField: setLinkField, onAddLink: addLink, onDeleteLink: deleteLink,
                onMoveSection: moveActionToSection,
                onAddImage: addImage, onRemoveImage: removeImage, onLightbox: setLightboxSrc
              });

              const renderCard = (a, i, sectionId) => {
                const isEditing = editingAction?.id === a.id;
                return (
                <div key={a.id} className="action-card" style={{"--accent":a.color,animationDelay:`${i*0.05}s`}}>
                  <button className="card-done-btn" onClick={()=>markDone(a.id)}>✓</button>
                  <span className="card-icon">{a.icon}</span>
                  <div className="card-cat-label">{CATS.find(c=>c.id===a.cat)?.label||a.cat}</div>

                  {isEditing ? (
                    <div style={{marginTop:6}}>
                      <input className="card-edit-title" autoFocus
                        value={editingAction.title}
                        onChange={e=>setEditingAction(p=>({...p,title:e.target.value}))}
                        onKeyDown={e=>e.key==="Enter"&&saveEdit()}/>
                      <select className="card-edit-cat" value={editingAction.cat}
                        onChange={e=>setEditingAction(p=>({...p,cat:e.target.value}))}>
                        {CATS.map(c=><option key={c.id} value={c.id}>{c.icon} {c.label}</option>)}
                      </select>
                      <button className="card-edit-save" onClick={saveEdit}>Save</button>
                      <button className="card-edit-cancel" onClick={()=>setEditingAction(null)}>Cancel</button>
                    </div>
                  ) : (
                    <div className="card-title">{a.title}</div>
                  )}

                  {!isEditing && (
                    <>
                      <div className="card-footer">
                        <button className="card-cta" onClick={()=>markDone(a.id)}>Mark as done <span>→</span></button>
                        <button className="card-notes-btn" onClick={()=>toggleNote(a.id)}>
                          {expandedNotes[a.id] ? "▲ hide" : ((a.notes||a.bullets?.length||a.links?.length||a.plannedDate||a.dueDate) ? "📝 details" : "+ details")}
                        </button>
                      </div>
                      {/* Assignee + added-by badges */}
                      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:6}}>
                        {a.assignedTo && (()=>{const m=TEAM.find(t=>t.id===a.assignedTo);return m?<span className="team-badge" style={{background:`${m.color}18`,color:m.color}}>{m.emoji} {m.name}</span>:null;})()}
                        {a.addedBy && a.addedBy!==a.assignedTo && (()=>{const m=TEAM.find(t=>t.id===a.addedBy);return m?<span className="team-badge" style={{background:"rgba(127,140,141,0.12)",color:"#7F8C8D"}}>+ {m.name}</span>:null;})()}
                      </div>
                      {(a.bullets||[]).length>0 && !expandedNotes[a.id] && (
                        <div style={{fontSize:12,color:"var(--muted)",fontFamily:"'Jost',sans-serif",marginTop:6}}>
                          {(a.bullets.filter(b=>b.done).length)}/{a.bullets.length} details done
                        </div>
                      )}
                      {(a.plannedDate||a.dueDate) && !expandedNotes[a.id] && (
                        <div className="card-date-badge">
                          {a.plannedDate && <span className="date-badge planned">📅 {new Date(a.plannedDate).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}{a.plannedDateTo ? " → "+new Date(a.plannedDateTo).toLocaleDateString("en-GB",{day:"numeric",month:"short"}) : ""}</span>}
                          {a.dueDate && <span className={`date-badge due${isDateSoon(a.dueDate)?" soon":""}`}>⏰ {new Date(a.dueDate).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</span>}
                        </div>
                      )}
                      {expandedNotes[a.id] && (
                        <div className="card-notes-area">
                          <NotesPanel {...notesProps(a)}/>
                        </div>
                      )}
                      <div style={{display:"flex",gap:6,marginTop:10,justifyContent:"flex-end"}}>
                        <button className="action-edit-btn" onClick={()=>startEdit(a)}>✏️ edit</button>
                        <button className="action-delete-btn" onClick={()=>startDelete(a.id)}>🗑️ delete</button>
                      </div>
                      <div className="card-move-btns">
                        <button className="card-move-btn" onClick={()=>moveAction(a.id,-1,sectionId)} title="Move up">↑</button>
                        <button className="card-move-btn" onClick={()=>moveAction(a.id,1,sectionId)} title="Move down">↓</button>
                      </div>
                    </>
                  )}
                </div>
                );
              };

              const renderListItem = (a, i, sectionId) => {
                const isEditing = editingAction?.id === a.id;
                return (
                <React.Fragment key={a.id}>
                  <div className="list-item" style={{animationDelay:`${i*0.035}s`}}>
                    <div className="action-move-btns">
                      <button className="move-btn" onClick={()=>moveAction(a.id,-1,sectionId)}>↑</button>
                      <button className="move-btn" onClick={()=>moveAction(a.id,1,sectionId)}>↓</button>
                    </div>
                    <div className="list-dot" style={{background:a.color}}/>
                    <div className="list-icon">{a.icon}</div>
                    <div className="list-content">
                      {isEditing ? (
                        <div style={{display:"flex",flexDirection:"column",gap:6}}>
                          <input className="card-edit-title" style={{fontSize:15}} autoFocus
                            value={editingAction.title}
                            onChange={e=>setEditingAction(p=>({...p,title:e.target.value}))}
                            onKeyDown={e=>e.key==="Enter"&&saveEdit()}/>
                          <select className="card-edit-cat" value={editingAction.cat}
                            onChange={e=>setEditingAction(p=>({...p,cat:e.target.value}))}>
                            {CATS.map(c=><option key={c.id} value={c.id}>{c.icon} {c.label}</option>)}
                          </select>
                          <div style={{display:"flex",gap:6}}>
                            <button className="card-edit-save" onClick={saveEdit}>Save</button>
                            <button className="card-edit-cancel" onClick={()=>setEditingAction(null)}>Cancel</button>
                          </div>
                        </div>
                      ) : (
                        <>
                          <div className="list-title">{a.title}</div>
                          <div className="list-meta">{CATS.find(c=>c.id===a.cat)?.label||a.cat}</div>
                        </>
                      )}
                    </div>
                    {!isEditing && <>
                      <button className="list-notes-btn" onClick={()=>toggleNote(a.id)}>
                        {expandedNotes[a.id] ? "▲" : ((a.notes||a.bullets?.length||a.links?.length) ? "📝 details" : "+ details")}
                      </button>
                      {a.assignedTo && (()=>{const m=TEAM.find(t=>t.id===a.assignedTo);return m?<span className="team-badge" style={{background:`${m.color}18`,color:m.color}}>{m.emoji} {m.name}</span>:null;})()}
                      <button className="action-edit-btn" onClick={()=>startEdit(a)}>✏️</button>
                      <button className="action-delete-btn" onClick={()=>startDelete(a.id)}>🗑️</button>
                      <button className="list-done-btn" onClick={()=>markDone(a.id)}>Done ✓</button>
                    </>}
                  </div>
                  {expandedNotes[a.id] && (
                    <div className="list-notes-area">
                      <NotesPanel {...notesProps(a)}/>
                    </div>
                  )}
                </React.Fragment>
                );
              };

              const renderSection = (sectionId, sectionTitle, isUnsectioned) => {
                const sectionActions = actions.filter(a => isUnsectioned ? !a.sectionId : a.sectionId===sectionId);
                if (sectionActions.length===0 && isUnsectioned) return null;
                const collapsed = collapsedSections[sectionId];
                return (
                  <div key={sectionId||"unsectioned"} className="section-block">
                    {/* Section header */}
                    <div className="section-header" onClick={()=>toggleSection(sectionId||"unsectioned")}>
                      <span className={`section-toggle${!collapsed?" open":""}`}>▶</span>
                      {editingSection===sectionId ? (
                        <input className="section-title-input" autoFocus
                          value={sectionTitle}
                          onChange={e=>updateSectionTitle(sectionId,e.target.value)}
                          onBlur={()=>setEditingSection(null)}
                          onKeyDown={e=>{if(e.key==="Enter")setEditingSection(null);}}
                          onClick={e=>e.stopPropagation()}/>
                      ) : (
                        <span className="section-title-text">{sectionTitle}</span>
                      )}
                      <span className="section-count">{sectionActions.length}</span>
                      {!isUnsectioned && (
                        <div className="section-actions-row" onClick={e=>e.stopPropagation()}>
                          <button className="section-btn" onClick={()=>setEditingSection(sectionId)}>✏️ rename</button>
                          <button className="section-btn danger" onClick={()=>deleteSection(sectionId)}>✕ delete</button>
                        </div>
                      )}
                    </div>
                    {/* Section add bar */}
                    {!collapsed && !isUnsectioned && (
                      <div className="add-bar" style={{marginBottom:12,background:"rgba(253,246,232,0.5)"}}>
                        <input value={newTitle} onChange={e=>setNewTitle(e.target.value)}
                          onKeyDown={e=>e.key==="Enter"&&addAction(sectionId)}
                          placeholder={`Add action to ${sectionTitle}…`}/>
                        <select value={newCat} onChange={e=>setNewCat(e.target.value)}>
                          {CATS.map(c=><option key={c.id} value={c.id}>{c.icon} {c.label}</option>)}
                        </select>
                        <button onClick={()=>addAction(sectionId)}>Add</button>
                      </div>
                    )}
                    {/* Actions */}
                    {!collapsed && (
                      sectionActions.length===0
                        ? <div style={{padding:"12px 0",color:"var(--muted)",fontStyle:"italic",fontFamily:"'Cormorant Garamond',serif",fontSize:17}}>No actions yet — add one above</div>
                        : view==="visual"
                          ? <div className="cards-canvas">{sectionActions.map((a,i)=>renderCard(a,i,sectionId))}</div>
                          : <div className="list-view">{sectionActions.map((a,i)=>renderListItem(a,i,sectionId))}</div>
                    )}
                  </div>
                );
              };

              return (
                <div>
                  {/* Sectioned actions */}
                  {sections.map(s => renderSection(s.id, s.title, false))}
                  {/* Unsectioned actions */}
                  {renderSection(null, "Other Actions", true)}
                  {/* Add section button */}
                  <button className="add-section-btn" onClick={addSection}>
                    ＋ Add Section
                  </button>
                </div>
              );
            })()}

            {/* ── CALENDAR ── */}
            {view==="calendar" && (() => {
              const today = toDateStr(new Date());
              return (
                <div>
                  {/* Sub-toggle: Month / Week */}
                  <div style={{display:"flex",gap:8,marginBottom:20}}>
                    <button className={`view-btn${calView==="month"?" active":""}`} onClick={()=>setCalView("month")}>Month</button>
                    <button className={`view-btn${calView==="week"?" active":""}`} onClick={()=>setCalView("week")}>Week</button>
                  </div>

                  {calView==="month" && (() => {
                    const y = calDate.getFullYear(), m = calDate.getMonth();
                    const firstDay = new Date(y, m, 1).getDay();
                    const daysInMonth = new Date(y, m+1, 0).getDate();
                    const cells = [];
                    for (let i=0;i<firstDay;i++) {
                      const d = new Date(y,m,1-firstDay+i);
                      cells.push({date:d,str:toDateStr(d),cur:false});
                    }
                    for (let i=1;i<=daysInMonth;i++) {
                      const d = new Date(y,m,i);
                      cells.push({date:d,str:toDateStr(d),cur:true});
                    }
                    while (cells.length%7!==0) {
                      const d = new Date(y,m+1,cells.length-firstDay-daysInMonth+1);
                      cells.push({date:d,str:toDateStr(d),cur:false});
                    }
                    return (
                      <div>
                        <div className="cal-header">
                          <button className="cal-nav" onClick={()=>setCalDate(addMonths(calDate,-1))}>‹</button>
                          <div className="cal-month-label">{calDate.toLocaleDateString("en-GB",{month:"long",year:"numeric"})}</div>
                          <button className="cal-nav" onClick={()=>setCalDate(addMonths(calDate,1))}>›</button>
                        </div>
                        <div className="cal-grid">
                          {["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>(
                            <div key={d} className="cal-day-name">{d}</div>
                          ))}
                          {cells.map((cell,i)=>{
                            const evts = eventsForDate(cell.str);
                            return (
                              <div key={i} className={`cal-cell${!cell.cur?" other-month":""}${cell.str===today?" today":""}`}>
                                <div className="cal-date-num">{cell.date.getDate()}</div>
                                {evts.map((e,j)=>(
                                  <div key={j} className={`cal-event ${e.type}`} title={e.title}>
                                    {e.icon} {e.title}
                                  </div>
                                ))}
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    );
                  })()}

                  {calView==="week" && (() => {
                    const weekStart = startOfWeek(calDate);
                    const days = Array.from({length:7},(_,i)=>addDays(weekStart,i));
                    return (
                      <div>
                        <div className="week-header">
                          <button className="cal-nav" onClick={()=>setCalDate(addDays(calDate,-7))}>‹ Prev</button>
                          <div className="week-label">
                            {weekStart.toLocaleDateString("en-GB",{day:"numeric",month:"short"})} – {addDays(weekStart,6).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}
                          </div>
                          <button className="cal-nav" onClick={()=>setCalDate(addDays(calDate,7))}>Next ›</button>
                        </div>
                        <div className="week-grid">
                          {days.map((day,i)=>{
                            const str = toDateStr(day);
                            const isToday = str===toDateStr(new Date());
                            const evts = eventsForDate(str);
                            return (
                              <div key={i} className={`week-col${isToday?" today-col":""}`}>
                                <div className="week-col-head">
                                  <div className="wday">{day.toLocaleDateString("en-GB",{weekday:"short"})}</div>
                                  <div className="wdate">{day.getDate()}</div>
                                </div>
                                <div className="week-events">
                                  {evts.map((e,j)=>(
                                    <div key={j} className={`week-event ${e.type}`}>
                                      <div className="week-event-title">{e.icon} {e.title}</div>
                                      <div className="week-event-proj">{e.type==="planned"?"📅 Planned":"⏰ Due"}</div>
                                    </div>
                                  ))}
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    );
                  })()}
                </div>
              );
            })()}

            {/* ── EVIDENCE WALL ── */}
            {done.length>0 && (
              <div className="evidence-section">
                <div className="evidence-header" onClick={()=>setShowEvidence(s=>!s)}>
                  <span className="evidence-title">My Evidence Wall</span>
                  <span className="evidence-count">{done.length} completed</span>
                  <span className={`evidence-arrow${showEvidence?" open":""}`}>▼</span>
                </div>
                {showEvidence && (
                  <div className="journal">
                    {Object.entries(monthGroups).map(([month,items])=>(
                      <div key={month} className="journal-month">
                        <div className="journal-month-label">{month}</div>
                        <div className="journal-entries">
                          {items.map((a,i)=>{
                            const cat=CATS.find(c=>c.id===a.cat);
                            return (
                              <div key={a.id} className="journal-entry" style={{animationDelay:`${i*0.035}s`}}>
                                <div className="journal-dot">✓</div>
                                <div className="journal-body">
                                  <button className="journal-restore" onClick={()=>restore(a.id)}>↩ restore</button>
                                  <div className="journal-body-title">{a.title}</div>
                                  <div className="journal-body-meta">
                                    <span className="journal-body-cat">{a.icon} {cat?.label||a.cat}</span>
                                    <span>{new Date(a.doneAt).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})}</span>
                                  </div>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            <div className="footer">
              <em>Your Sparkle is the key that opens doors</em>
              Words That Deliver · The Personal Brand Strategy Studio · © Carole Pyke
            </div>
          </>
        )}
      </div>

      {/* ── CONTEXT MENU ── */}
      {ctxMenu && (
        <div className="ctx-menu" style={{top: ctxMenu.y, left: ctxMenu.x}}
          onClick={e=>e.stopPropagation()}>
          <div className="ctx-label">Move under…</div>
          {projects.filter(p => p.id !== ctxMenu.projId && !p.parentId).map(p => (
            <div key={p.id} className="ctx-item" onClick={()=>setParent(ctxMenu.projId, p.id)}>
              {p.emoji} {p.name}
            </div>
          ))}
          {projects.find(p=>p.id===ctxMenu.projId)?.parentId && (
            <>
              <div className="ctx-divider"/>
              <div className="ctx-item" onClick={()=>setParent(ctxMenu.projId, null)}>
                ↑ Move to top level
              </div>
            </>
          )}
          <div className="ctx-divider"/>
          <div className="ctx-item danger" onClick={e=>{ deleteProject(ctxMenu.projId, e); closeCtxMenu(); }}>
            ✕ Remove project
          </div>
        </div>
      )}

      {/* ── LIGHTBOX ── */}
      {lightboxSrc && (
        <div className="lightbox" onClick={()=>setLightboxSrc(null)}>
          <button className="lightbox-close" onClick={()=>setLightboxSrc(null)}>✕</button>
          <img src={lightboxSrc} alt="" onClick={e=>e.stopPropagation()}/>
        </div>
      )}

      {/* ── DELETE CONFIRMATION MODAL ── */}
      {deletePrompt && (
        <div className="delete-modal-overlay" onClick={()=>setDeletePrompt(null)}>
          <div className="delete-modal" onClick={e=>e.stopPropagation()}>
            <h3>Delete this action?</h3>
            <p>This can't be undone. Type <strong>delete</strong> below to confirm.</p>
            <input className="delete-modal-input" autoFocus
              placeholder="Type delete to confirm…"
              value={deletePrompt.confirmText}
              onChange={e=>setDeletePrompt(p=>({...p,confirmText:e.target.value}))}
              onKeyDown={e=>e.key==="Enter"&&confirmDelete()}/>
            <div style={{display:"flex",gap:8}}>
              <button
                className={`delete-modal-confirm${deletePrompt.confirmText.toLowerCase()==="delete"?" ready":""}`}
                onClick={confirmDelete}>Delete action</button>
              <button className="delete-modal-cancel" onClick={()=>setDeletePrompt(null)}>Cancel</button>
            </div>
          </div>
        </div>
      )}

      {/* ── DELETE PROJECT MODAL ── */}
      {deleteProjPrompt && (
        <div className="delete-modal-overlay" onClick={()=>setDeleteProjPrompt(null)}>
          <div className="delete-modal" onClick={e=>e.stopPropagation()}>
            <h3>Delete this project?</h3>
            <p>All actions and data in this project will be permanently removed. Type <strong>delete</strong> to confirm.</p>
            <input className="delete-modal-input" autoFocus
              placeholder="Type delete to confirm…"
              value={deleteProjPrompt.confirmText}
              onChange={e=>setDeleteProjPrompt(p=>({...p,confirmText:e.target.value}))}
              onKeyDown={e=>e.key==="Enter"&&confirmDeleteProject()}/>
            <div style={{display:"flex",gap:8}}>
              <button
                className={`delete-modal-confirm${deleteProjPrompt.confirmText.toLowerCase()==="delete"?" ready":""}`}
                onClick={confirmDeleteProject}>Delete project</button>
              <button className="delete-modal-cancel" onClick={()=>setDeleteProjPrompt(null)}>Cancel</button>
            </div>
          </div>
        </div>
      )}

      {/* ── PRINT SHEET ── */}
      {printContent && (
        <div className="print-sheet">
          <div className="ps-header" style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end"}}>
            <div>
              <div style={{fontSize:11,letterSpacing:3,textTransform:"uppercase",color:"#A07820",marginBottom:6,fontFamily:"'Jost',sans-serif"}}>Words That Deliver · Action Dashboard</div>
              <div className="ps-title">{printContent.title}</div>
            </div>
            <div style={{fontSize:13,color:"#888",textAlign:"right",fontFamily:"'Jost',sans-serif"}}>{printContent.dateStr}</div>
          </div>
          <div style={{fontSize:13,color:"#888",fontFamily:"'Jost',sans-serif",marginBottom:20}}>
            {printContent.count} action{printContent.count!==1?"s":""} {printContent.todayOnly?"scheduled for today":"remaining"}
          </div>
          {printContent.goal && (
            <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:18,fontStyle:"italic",color:"#A07820",borderLeft:"3px solid #A07820",padding:"10px 16px",marginBottom:24,background:"rgba(160,120,32,0.05)",borderRadius:"0 8px 8px 0"}}>
              🎯 {printContent.goal}
            </div>
          )}
          {printContent.count===0 ? (
            <p style={{color:"#888",fontStyle:"italic",fontFamily:"'Cormorant Garamond',serif",fontSize:18}}>Nothing scheduled for today — enjoy the space! ✨</p>
          ) : printContent.grouped.map((group, gi) => (
            <div key={gi}>
              {group.label && (
                <div style={{fontSize:11,letterSpacing:3,textTransform:"uppercase",color:group.isGold?"#A07820":"#888",fontFamily:"'Jost',sans-serif",margin:"24px 0 8px",paddingBottom:6,borderBottom:"1px solid #eee"}}>
                  {group.label}
                </div>
              )}
              {group.items.map(a => {
                const cat = CATS.find(c=>c.id===a.cat);
                return (
                  <div key={a.id} className="ps-item">
                    <div className="ps-checkbox"/>
                    <div className="ps-content">
                      <div className="ps-cat">{a.icon} {cat?.label||a.cat}</div>
                      <div className="ps-item-title">{a.title}</div>
                      {a.notes && <div className="ps-notes">{a.notes}</div>}
                      {(a.bullets||[]).length>0 && (
                        <ul style={{margin:"4px 0 4px 16px",padding:0,fontSize:13,color:"#555",fontFamily:"'Jost',sans-serif"}}>
                          {a.bullets.map(b=><li key={b.id}>{b.text}</li>)}
                        </ul>
                      )}
                      {(a.links||[]).length>0 && (
                        <div style={{marginTop:4}}>
                          {a.links.map(l=>(
                            <div key={l.id} style={{fontSize:12,color:"#4A7B9D",fontFamily:"'Jost',sans-serif"}}>
                              🔗 {l.title} — {l.url}
                            </div>
                          ))}
                        </div>
                      )}
                      {(a.plannedDate||a.dueDate) && (
                        <div className="ps-dates">
                          {a.plannedDate && <span className="ps-date-planned">📅 {new Date(a.plannedDate).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}{a.plannedDateTo?" → "+new Date(a.plannedDateTo).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):""}</span>}
                          {a.dueDate && <span className="ps-date-due">⏰ Due: {new Date(a.dueDate).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}</span>}
                        </div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          ))}
          <div style={{marginTop:40,textAlign:"center",fontFamily:"'Cormorant Garamond',serif",fontSize:15,fontStyle:"italic",color:"#A07820"}}>
            Your Sparkle is the key that opens doors
          </div>
        </div>
      )}

      {/* ── NEW PROJECT MODAL ── */}
      {showNewProj && (
        <div className="modal-overlay" onClick={()=>{setShowNewProj(false);setNewProjName("");setNewProjVisibility("shared");setNewProjAssignee(null);}}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <h2>New Project</h2>
            <p>Give your project a name, pick an icon, and set who it's for.</p>
            <span className="modal-label">Choose an icon</span>
            <div className="modal-emoji-row">
              {EMOJIS.map(e=>(
                <button key={e} className={`modal-emoji-opt${newProjEmoji===e?" selected":""}`}
                  onClick={()=>setNewProjEmoji(e)}>{e}</button>
              ))}
            </div>
            <span className="modal-label">Project name</span>
            <input className="modal-input" value={newProjName}
              onChange={e=>setNewProjName(e.target.value)}
              onKeyDown={e=>e.key==="Enter"&&createProject()}
              placeholder="e.g. THRIVE 2026, Website Rebrand…"
              autoFocus/>
            <span className="modal-label">Visibility</span>
            <div style={{display:"flex",gap:10,marginBottom:16}}>
              {["shared","personal"].map(v=>(
                <button key={v} onClick={()=>setNewProjVisibility(v)}
                  style={{flex:1,padding:"10px",borderRadius:9,border:`2px solid ${newProjVisibility===v?"var(--gold)":"var(--border)"}`,background:newProjVisibility===v?"rgba(160,120,32,0.06)":"white",cursor:"pointer",fontFamily:"'Jost',sans-serif",fontSize:14,color:newProjVisibility===v?"var(--gold)":"var(--muted)",transition:"all 0.15s"}}>
                  {v==="shared" ? "🤝 Shared — all team" : "🔒 Personal — specific person"}
                </button>
              ))}
            </div>
            <span className="modal-label">Assign to</span>
            <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
              {TEAM.map(m=>(
                <button key={m.id} onClick={()=>setNewProjAssignee(newProjAssignee===m.id?null:m.id)}
                  style={{padding:"8px 14px",borderRadius:9,border:`2px solid ${newProjAssignee===m.id?m.color:"var(--border)"}`,background:newProjAssignee===m.id?`${m.color}15`:"white",cursor:"pointer",fontFamily:"'Jost',sans-serif",fontSize:14,color:newProjAssignee===m.id?m.color:"var(--muted)",transition:"all 0.15s"}}>
                  {m.emoji} {m.name}
                </button>
              ))}
            </div>
            <div className="modal-btns">
              <button className="modal-btn-cancel" onClick={()=>{setShowNewProj(false);setNewProjName("");setNewProjVisibility("shared");setNewProjAssignee(null);}}>Cancel</button>
              <button className="modal-btn-create" onClick={createProject}>Create project →</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Action Dashboard — Words That Deliver</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #FDF6E8; --gold: #A07820; --gold-light: #C9A84C;
      --dark: #2C1F0E; --muted: rgba(44,31,14,0.45);
      --border: rgba(160,120,32,0.18); --card-bg: rgba(255,255,255,0.95);
      --sidebar-w: 260px;
    }
    html, body { height: 100%; }
    body { background: var(--cream); font-family: 'Jost', sans-serif; overflow-x: hidden; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 70% 50% at 0% 0%, rgba(201,168,76,0.10) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 100% 100%, rgba(160,120,32,0.07) 0%, transparent 60%);
    }

    /* ── Layout ── */
    .layout { display: flex; min-height: 100vh; position: relative; z-index: 1; }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar-w);
      background: white;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 100;
      transition: transform 0.3s ease;
    }
    .sidebar-brand {
      padding: 28px 20px 20px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-eyebrow {
      font-size: 13px; letter-spacing: 4px; text-transform: uppercase;
      color: var(--gold); opacity: 0.7; margin-bottom: 4px;
    }
    .sidebar-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px; font-weight: 400; color: var(--dark); line-height: 1.3;
    }
    .sidebar-user {
      font-size: 15px; color: var(--muted); margin-top: 6px;
    }

    /* ── Name selector screen ── */
    .name-selector {
      position: fixed; inset: 0; background: var(--cream);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 1000; gap: 0;
    }
    .name-selector-eyebrow {
      font-size: 11px; letter-spacing: 4px; text-transform: uppercase;
      color: var(--gold); font-family: 'Jost', sans-serif; margin-bottom: 12px;
    }
    .name-selector-title {
      font-family: 'Cormorant Garamond', serif; font-size: 38px; font-weight: 300;
      color: var(--dark); margin-bottom: 8px; text-align: center;
    }
    .name-selector-sub {
      font-size: 15px; color: var(--muted); font-family: 'Jost', sans-serif;
      margin-bottom: 48px; text-align: center;
    }
    .name-selector-cards {
      display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;
    }
    .name-card {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      padding: 32px 36px; border-radius: 16px; background: white; cursor: pointer;
      border: 2px solid var(--border); transition: all 0.2s;
      box-shadow: 0 4px 20px rgba(44,31,14,0.06); min-width: 140px;
    }
    .name-card:hover { border-color: var(--gold); transform: translateY(-3px); box-shadow: 0 8px 32px rgba(160,120,32,0.15); }
    .name-card-emoji { font-size: 36px; }
    .name-card-name { font-family: 'Cormorant Garamond', serif; font-size: 22px; color: var(--dark); }

    /* ── Team badges ── */
    .team-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-family: 'Jost', sans-serif;
      padding: 2px 8px; border-radius: 20px; font-weight: 500;
      white-space: nowrap;
    }
    .assign-select {
      font-size: 12px; border: 1px solid var(--border); border-radius: 6px;
      padding: 4px 8px; background: white; color: var(--muted);
      font-family: 'Jost', sans-serif; cursor: pointer; margin-top: 8px;
      width: 100%;
    }
    .added-by-label {
      font-size: 11px; color: var(--muted); font-family: 'Jost', sans-serif;
      margin-top: 6px;
    }

    /* ── New assignments banner ── */
    .new-assign-banner {
      background: linear-gradient(135deg, rgba(160,120,32,0.08), rgba(160,120,32,0.04));
      border: 1px solid rgba(160,120,32,0.25); border-radius: 12px;
      padding: 16px 20px; margin-bottom: 24px;
    }
    .new-assign-banner-title {
      font-family: 'Cormorant Garamond', serif; font-size: 18px; color: var(--gold);
      margin-bottom: 8px;
    }
    .new-assign-item {
      font-size: 13px; font-family: 'Jost', sans-serif; color: var(--dark);
      padding: 4px 0; border-bottom: 1px solid var(--border);
    }
    .new-assign-item:last-child { border-bottom: none; }

    /* ── Project visibility badge ── */
    .proj-visibility-badge {
      font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
      font-family: 'Jost', sans-serif; padding: 2px 6px; border-radius: 4px;
      margin-left: 4px;
    }
    .proj-visibility-badge.shared { background: rgba(74,123,157,0.12); color: #4A7B9D; }
    .proj-visibility-badge.personal { background: rgba(160,120,32,0.12); color: var(--gold); }

    /* Projects list */
    .sidebar-section-label {
      font-size: 13px; letter-spacing: 3px; text-transform: uppercase;
      color: var(--muted); padding: 20px 20px 8px;
    }
    .project-list { flex: 1; overflow-y: auto; padding: 0 10px; }
    .project-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 10px; cursor: pointer;
      transition: all 0.15s; margin-bottom: 2px; position: relative;
    }
    .project-item:hover { background: rgba(160,120,32,0.06); }
    .project-item.active { background: rgba(160,120,32,0.1); }
    .project-item.active::before {
      content: ''; position: absolute; left: 0; top: 20%; bottom: 20%;
      width: 3px; border-radius: 0 3px 3px 0; background: var(--gold);
    }
    .project-dot {
      width: 28px; height: 28px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .project-info { flex: 1; min-width: 0; }
    .project-name {
      font-size: 15px; color: var(--dark); font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .project-count { font-size: 13px; color: var(--muted); }
    .project-delete {
      opacity: 0; font-size: 17px; color: var(--muted);
      background: none; border: none; cursor: pointer;
      padding: 2px 4px; border-radius: 4px; transition: all 0.15s;
      flex-shrink: 0;
    }
    .project-item:hover .project-delete { opacity: 1; }
    .project-delete:hover { color: #C0392B; background: rgba(192,57,43,0.08); }

    /* New project button */
    .new-project-btn {
      margin: 8px 10px 0;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1.5px dashed var(--border);
      background: none;
      font-family: 'Jost', sans-serif;
      font-size: 15px;
      color: var(--muted);
      cursor: pointer;
      width: calc(100% - 20px);
      text-align: left;
      transition: all 0.15s;
      display: flex; align-items: center; gap: 8px;
    }
    .new-project-btn:hover { border-color: var(--gold); color: var(--gold); background: rgba(160,120,32,0.04); }

    /* New project MODAL */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(44,31,14,0.45);
      z-index: 300; display: flex; align-items: center; justify-content: center;
      padding: 24px; animation: fadeIn 0.2s ease;
    }
    .modal-box {
      background: white; border-radius: 20px; padding: 40px;
      max-width: 520px; width: 100%;
      box-shadow: 0 24px 64px rgba(44,31,14,0.2);
      border-top: 4px solid var(--gold);
      animation: slideUp 0.25s ease;
    }
    .modal-box h2 {
      font-family: 'Cormorant Garamond', serif; font-size: 30px;
      font-weight: 300; color: var(--dark); margin-bottom: 6px;
    }
    .modal-box p {
      font-size: 17px; color: var(--muted); margin-bottom: 28px; line-height: 1.6;
    }
    .modal-label {
      font-size: 14px; letter-spacing: 3px; text-transform: uppercase;
      color: var(--muted); margin-bottom: 12px; display: block;
    }
    .modal-emoji-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 28px; }
    .modal-emoji-opt {
      width: 48px; height: 48px; border-radius: 12px; border: 2px solid var(--border);
      background: var(--cream); cursor: pointer; font-size: 22px;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .modal-emoji-opt:hover { border-color: var(--gold); background: rgba(160,120,32,0.06); }
    .modal-emoji-opt.selected { border-color: var(--gold); background: rgba(160,120,32,0.12); transform: scale(1.1); }
    .modal-input {
      width: 100%; border: 1.5px solid var(--border); border-radius: 10px;
      padding: 16px 20px; font-size: 20px; font-family: 'Jost', sans-serif;
      color: var(--dark); background: var(--cream); outline: none;
      margin-bottom: 24px; transition: border-color 0.2s;
    }
    .modal-input:focus { border-color: var(--gold); background: white; }
    .modal-btns { display: flex; gap: 12px; }
    .modal-btns button {
      flex: 1; padding: 16px; border-radius: 10px; font-size: 18px;
      font-family: 'Jost', sans-serif; cursor: pointer; border: none; transition: all 0.15s;
    }
    .modal-btn-create { background: var(--gold); color: white; }
    .modal-btn-create:hover { opacity: 0.88; }
    .modal-btn-cancel { background: rgba(160,120,32,0.08); color: var(--muted); }
    .modal-btn-cancel:hover { background: rgba(160,120,32,0.14); }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    .sidebar-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      font-size: 16px; color: var(--muted);
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
    }

    /* ── Main content ── */
    .main {
      margin-left: var(--sidebar-w);
      flex: 1;
      padding: 44px 36px 80px;
      max-width: calc(100vw - var(--sidebar-w));
    }

    /* ── Header ── */
    .main-header { margin-bottom: 36px; }
    .main-eyebrow { font-size: 12px; letter-spacing: 4px; text-transform: uppercase; color: var(--gold); opacity: 0.7; margin-bottom: 8px; }
    .main-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(34px, 5vw, 52px); font-weight: 300; color: var(--dark); line-height: 1.15; margin-bottom: 6px; }
    .main-sub { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-style: italic; color: var(--gold); margin-bottom: 20px; }

    /* ── Project Goal ── */
    .project-goal-wrap {
      background: rgba(160,120,32,0.06); border: 1px solid rgba(160,120,32,0.2);
      border-radius: 14px; padding: 18px 22px; margin-bottom: 24px;
      position: relative; transition: border-color 0.2s;
    }
    .project-goal-wrap:hover { border-color: rgba(160,120,32,0.4); }
    .goal-eyebrow { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); font-family: 'Jost', sans-serif; margin-bottom: 8px; opacity: 0.8; }
    .goal-text { font-family: 'Cormorant Garamond', serif; font-size: 22px; color: var(--dark); line-height: 1.5; font-style: italic; }
    .goal-empty { font-family: 'Cormorant Garamond', serif; font-size: 19px; color: var(--muted); font-style: italic; cursor: pointer; }
    .goal-input {
      width: 100%; border: none; background: transparent; outline: none;
      font-family: 'Cormorant Garamond', serif; font-size: 22px; color: var(--dark);
      line-height: 1.5; font-style: italic; resize: none; min-height: 60px;
    }
    .goal-edit-btn {
      position: absolute; top: 14px; right: 14px; background: none; border: none;
      font-size: 14px; color: var(--muted); cursor: pointer; opacity: 0;
      transition: opacity 0.15s; font-family: 'Jost', sans-serif;
    }
    .project-goal-wrap:hover .goal-edit-btn { opacity: 1; }
    .goal-edit-btn:hover { color: var(--gold); }
    .today-pill {
      display: inline-block; background: white; border: 1px solid var(--border);
      border-radius: 100px; padding: 12px 28px; font-size: 17px; color: var(--muted);
      font-style: italic; box-shadow: 0 2px 12px rgba(160,120,32,0.07);
    }
    .today-pill strong { color: var(--dark); font-style: normal; font-weight: 500; }

    /* ── Toolbar ── */
    .toolbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
    }
    .toolbar-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .count-badge {
      font-size: 15px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted);
    }
    .view-toggle {
      display: flex; background: white; border: 1px solid var(--border);
      border-radius: 9px; padding: 3px; gap: 2px;
      box-shadow: 0 1px 6px rgba(160,120,32,0.06);
    }
    .view-btn {
      padding: 9px 22px; border-radius: 7px; border: none; font-size: 16px;
      font-family: 'Jost', sans-serif; cursor: pointer; transition: all 0.2s;
      color: var(--muted); background: none; display: flex; align-items: center; gap: 5px;
    }
    .view-btn.active { background: var(--gold); color: white; }

    /* ── Add bar ── */
    .add-bar {
      display: flex; gap: 10px; margin-bottom: 28px;
      background: white; border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 16px;
      box-shadow: 0 2px 12px rgba(160,120,32,0.06); flex-wrap: wrap;
    }
    .add-bar input, .add-bar select {
      border: 1px solid var(--border); background: rgba(253,246,232,0.5);
      border-radius: 8px; padding: 12px 16px; font-size: 17px;
      font-family: 'Jost', sans-serif; color: var(--dark); outline: none;
      transition: border-color 0.2s;
    }
    .add-bar input:focus, .add-bar select:focus { border-color: var(--gold); }
    .add-bar input { flex: 1; min-width: 150px; }
    .add-bar button {
      padding: 8px 20px; border-radius: 8px; border: none;
      background: var(--gold); color: white; font-family: 'Jost', sans-serif;
      font-size: 17px; cursor: pointer; transition: opacity 0.15s; white-space: nowrap;
    }
    .add-bar button:hover { opacity: 0.85; }

    /* ── Visual cards ── */
    .cards-canvas {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 16px; margin-bottom: 40px;
    }
    .action-card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 16px; padding: 22px 20px 18px; position: relative;
      overflow: hidden; transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s ease;
      animation: cardIn 0.4s ease backwards; cursor: default;
    }
    .action-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: var(--accent, var(--gold)); border-radius: 16px 16px 0 0;
    }
    .action-card:hover { transform: translateY(-3px) scale(1.01); box-shadow: 0 10px 32px rgba(160,120,32,0.12); }
    .card-done-btn {
      position: absolute; top: 12px; right: 12px; width: 28px; height: 28px;
      border-radius: 50%; border: 1.5px solid var(--border); background: white;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 14px; color: transparent; transition: all 0.2s;
    }
    .action-card:hover .card-done-btn { border-color: var(--accent, var(--gold)); color: var(--accent, var(--gold)); }
    .card-done-btn:hover { background: var(--accent, var(--gold)) !important; color: white !important; }
    .card-icon { font-size: 40px; margin-bottom: 12px; display: block; line-height: 1; }
    .card-cat-label { font-size: 15px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent, var(--gold)); margin-bottom: 5px; font-weight: 600; }
    .card-title { font-family: 'Cormorant Garamond', serif; font-size: 20px; color: var(--dark); line-height: 1.4; margin-bottom: 14px; }
    .card-cta {
      font-size: 15px; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--accent, var(--gold)); font-weight: 600; background: none; border: none;
      cursor: pointer; padding: 0; display: flex; align-items: center; gap: 5px; transition: gap 0.2s;
    }
    .action-card:hover .card-cta { gap: 8px; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 2px; }
    .card-notes-btn {
      font-size: 15px; color: var(--muted); background: none; border: none;
      cursor: pointer; padding: 0; display: flex; align-items: center; gap: 4px;
      transition: color 0.15s; font-family: 'Jost', sans-serif;
    }
    .card-notes-btn:hover { color: var(--accent, var(--gold)); }
    .card-notes-area {
      margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px;
      animation: cardIn 0.2s ease;
    }
    .card-notes-input {
      width: 100%; border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 12px; font-size: 16px; font-family: 'Jost', sans-serif;
      color: var(--dark); background: rgba(253,246,232,0.5); outline: none;
      resize: none; min-height: 80px; line-height: 1.6; transition: border-color 0.2s;
    }
    .card-notes-input:focus { border-color: var(--accent, var(--gold)); background: white; }
    .card-notes-display {
      font-size: 16px; color: var(--muted); line-height: 1.65;
      white-space: pre-wrap; font-family: 'Jost', sans-serif;
    }
    /* List notes */
    .list-notes-btn {
      font-size: 15px; color: var(--muted); background: none; border: none;
      cursor: pointer; padding: 4px 8px; border-radius: 6px;
      transition: all 0.15s; font-family: 'Jost', sans-serif; white-space: nowrap; flex-shrink: 0;
    }
    .list-notes-btn:hover { background: rgba(160,120,32,0.08); color: var(--gold); }
    .list-notes-area {
      padding: 10px 18px 14px calc(14px + 9px + 20px + 14px + 14px);
      background: rgba(253,246,232,0.4); border-bottom: 1px solid var(--border);
      animation: cardIn 0.2s ease;
    }
    .list-notes-input {
      width: 100%; border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 12px; font-size: 16px; font-family: 'Jost', sans-serif;
      color: var(--dark); background: white; outline: none;
      resize: none; min-height: 70px; line-height: 1.6; transition: border-color 0.2s;
    }
    .list-notes-input:focus { border-color: var(--gold); }

    /* ── Image gallery ── */
    .notes-images {
      display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;
    }
    .notes-thumb {
      width: 72px; height: 72px; border-radius: 8px; object-fit: cover;
      border: 1.5px solid var(--border); cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .notes-thumb:hover { transform: scale(1.06); box-shadow: 0 4px 16px rgba(44,31,14,0.15); }
    .notes-add-img {
      width: 72px; height: 72px; border-radius: 8px;
      border: 1.5px dashed var(--border); background: rgba(253,246,232,0.6);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; font-size: 20px; color: var(--muted);
      transition: all 0.15s; gap: 2px;
    }
    .notes-add-img:hover { border-color: var(--gold); color: var(--gold); background: rgba(160,120,32,0.06); }
    .notes-add-img span { font-size: 13px; letter-spacing: 1px; text-transform: uppercase; font-family: 'Jost', sans-serif; }
    .notes-thumb-wrap { position: relative; }
    .notes-thumb-del {
      position: absolute; top: -5px; right: -5px; width: 18px; height: 18px;
      border-radius: 50%; background: #C0392B; color: white; border: none;
      font-size: 12px; cursor: pointer; display: none;
      align-items: center; justify-content: center; line-height: 1;
    }
    .notes-thumb-wrap:hover .notes-thumb-del { display: flex; }

    /* Lightbox */
    .lightbox {
      position: fixed; inset: 0; background: rgba(0,0,0,0.88);
      z-index: 500; display: flex; align-items: center; justify-content: center;
      padding: 24px; animation: fadeIn 0.2s ease;
    }
    .lightbox img {
      max-width: 90vw; max-height: 88vh; border-radius: 10px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.5);
    }
    .lightbox-close {
      position: absolute; top: 20px; right: 24px; font-size: 32px;
      color: white; background: none; border: none; cursor: pointer;
      opacity: 0.7; transition: opacity 0.15s;
    }
    .lightbox-close:hover { opacity: 1; }

    .project-menu-btn {
      opacity: 0; font-size: 22px; color: var(--muted); background: none; border: none;
      cursor: pointer; padding: 2px 5px; border-radius: 5px;
      transition: all 0.15s; flex-shrink: 0; line-height: 1;
    }
    .project-item:hover .project-menu-btn { opacity: 1; }
    .project-menu-btn:hover { background: rgba(160,120,32,0.1); color: var(--gold); }
    .ctx-menu {
      position: fixed; background: white; border: 1px solid var(--border);
      border-radius: 10px; box-shadow: 0 8px 32px rgba(44,31,14,0.15);
      z-index: 400; min-width: 200px; padding: 6px;
      animation: slideUp 0.15s ease;
    }
    .ctx-item {
      padding: 12px 16px; border-radius: 7px; cursor: pointer; font-size: 17px;
      color: var(--dark); font-family: 'Jost', sans-serif; display: flex; align-items: center; gap: 10px;
      transition: background 0.1s;
    }
    .ctx-item:hover { background: rgba(160,120,32,0.08); }
    .ctx-item.danger { color: #C0392B; }
    .ctx-item.danger:hover { background: rgba(192,57,43,0.08); }
    .ctx-divider { height: 1px; background: var(--border); margin: 4px 0; }
    .ctx-label { padding: 8px 16px 6px; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }

    /* ── Sub-board styles ── */
    .project-group { margin-bottom: 2px; }
    .project-item-sub {
      padding-left: 28px !important; opacity: 0.9;
    }
    .project-item-sub .project-dot { width: 22px !important; height: 22px !important; font-size: 12px !important; }
    .project-item-sub .project-name { font-size: 16px !important; }
    .sub-connector {
      position: absolute; left: 20px; top: 0; bottom: 0;
      width: 1px; background: var(--border);
    }
    .group-toggle {
      width: 20px; height: 20px; border-radius: 4px; border: 1px solid var(--border);
      background: white; cursor: pointer; display: flex; align-items: center;
      justify-content: center; font-size: 11px; color: var(--muted);
      flex-shrink: 0; transition: all 0.15s; margin-right: -4px;
    }
    .group-toggle:hover { border-color: var(--gold); color: var(--gold); }

    /* ── Drag styles ── */
    .project-item.dragging { opacity: 0.4; }
    .project-item.drag-over { border-top: 2px solid var(--gold); }
    /* ── Sections ── */
    .section-block { margin-bottom: 32px; }
    .section-header {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 0; margin-bottom: 12px;
      border-bottom: 2px solid var(--border); cursor: pointer;
    }
    .section-toggle { font-size: 11px; color: var(--muted); width: 16px; transition: transform 0.2s; }
    .section-toggle.open { transform: rotate(90deg); }
    .section-title-text {
      font-family: 'Jost', sans-serif; font-size: 16px; font-weight: 600;
      color: var(--dark); letter-spacing: 0.5px; flex: 1;
    }
    .section-title-input {
      font-family: 'Jost', sans-serif; font-size: 16px; font-weight: 600;
      color: var(--dark); border: none; border-bottom: 2px solid var(--gold);
      background: transparent; outline: none; flex: 1; padding: 2px 0;
    }
    .section-count { font-size: 13px; color: var(--muted); }
    .section-actions-row { display: flex; gap: 8px; margin-left: auto; }
    .section-btn {
      font-size: 12px; color: var(--muted); background: none; border: none;
      cursor: pointer; padding: 3px 8px; border-radius: 6px;
      font-family: 'Jost', sans-serif; transition: all 0.15s;
    }
    .section-btn:hover { background: rgba(160,120,32,0.08); color: var(--gold); }
    .section-btn.danger:hover { background: rgba(192,57,43,0.08); color: #C0392B; }
    .add-section-btn {
      display: flex; align-items: center; gap: 8px; padding: 12px 18px;
      border: 1.5px dashed var(--border); border-radius: 10px;
      background: none; cursor: pointer; font-size: 15px; color: var(--muted);
      font-family: 'Jost', sans-serif; width: 100%; margin-top: 8px;
      transition: all 0.15s;
    }
    .add-section-btn:hover { border-color: var(--gold); color: var(--gold); background: rgba(160,120,32,0.03); }
    .unsectioned-label {
      font-size: 12px; letter-spacing: 3px; text-transform: uppercase;
      color: var(--muted); font-family: 'Jost', sans-serif;
      padding: 8px 0; margin-bottom: 12px; border-bottom: 1px dashed var(--border);
    }
    /* Move to section dropdown on action */
    .move-section-select {
      font-size: 12px; border: 1px solid var(--border); border-radius: 6px;
      padding: 3px 6px; background: white; color: var(--muted);
      font-family: 'Jost', sans-serif; cursor: pointer; margin-top: 6px;
    }
    .notes-dates { display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
    .date-field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 130px; }
    .date-label { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); font-family: 'Jost', sans-serif; }
    .date-input { border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; font-size: 15px; font-family: 'Jost', sans-serif; color: var(--dark); background: white; outline: none; transition: border-color 0.2s; width: 100%; }
    .date-input:focus { border-color: var(--gold); }
    .card-date-badge { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; margin-bottom: 2px; }
    .date-badge { font-size: 12px; font-family: 'Jost', sans-serif; padding: 3px 9px; border-radius: 20px; display: flex; align-items: center; gap: 4px; }
    .date-badge.planned { background: rgba(74,123,157,0.12); color: #4A7B9D; }
    .date-badge.due { background: rgba(231,76,60,0.1); color: #C0392B; }
    .date-badge.due.soon { background: rgba(231,76,60,0.2); color: #C0392B; font-weight: 600; }

    /* ── Bullet points ── */
    .notes-bullets-wrap { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px; }
    .notes-section-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); font-family: 'Jost', sans-serif; margin-bottom: 8px; }
    .bullet-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .bullet-dot { color: var(--gold); font-size: 16px; flex-shrink: 0; line-height: 1; }
    .bullet-input { flex: 1; border: none; border-bottom: 1px solid var(--border); background: transparent; font-size: 15px; font-family: 'Jost', sans-serif; color: var(--dark); outline: none; padding: 4px 0; transition: border-color 0.2s; }
    .bullet-input:focus { border-bottom-color: var(--gold); }
    .bullet-del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; opacity: 0; transition: opacity 0.15s; padding: 0 4px; line-height: 1; }
    .bullet-item:hover .bullet-del { opacity: 1; }
    .bullet-add { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; font-family: 'Jost', sans-serif; padding: 4px 0; margin-top: 2px; transition: color 0.15s; }
    .bullet-add:hover { color: var(--gold); }
    .bullet-check {
      width: 18px; height: 18px; border-radius: 4px; border: 1.5px solid var(--border);
      background: white; cursor: pointer; font-size: 11px; color: white;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all 0.15s; padding: 0;
    }
    .bullet-check.checked { background: var(--gold); border-color: var(--gold); }
    .bullet-check:hover:not(.checked) { border-color: var(--gold); }
    .bullet-done .bullet-input { text-decoration: line-through; color: var(--muted); }

    /* ── Links ── */
    .notes-links-wrap { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px; }
    .link-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; background: rgba(74,123,157,0.06); border-radius: 8px; padding: 9px 12px; }
    .link-emoji { font-size: 16px; flex-shrink: 0; }
    .link-info { flex: 1; min-width: 0; }
    .link-name { font-size: 14px; font-family: 'Jost', sans-serif; color: #4A7B9D; font-weight: 500; text-decoration: none; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .link-name:hover { text-decoration: underline; }
    .link-url-small { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
    .link-del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; opacity: 0; transition: opacity 0.15s; flex-shrink: 0; }
    .link-item:hover .link-del { opacity: 1; }
    .add-link-row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .add-link-input { flex: 1; min-width: 80px; border: 1px solid var(--border); border-radius: 7px; padding: 7px 10px; font-size: 13px; font-family: 'Jost', sans-serif; color: var(--dark); background: white; outline: none; transition: border-color 0.2s; }
    .add-link-input:focus { border-color: var(--gold); }
    .add-link-btn { padding: 7px 14px; border-radius: 7px; border: none; background: var(--gold); color: white; font-size: 13px; font-family: 'Jost', sans-serif; cursor: pointer; white-space: nowrap; transition: opacity 0.15s; }
    .add-link-btn:hover { opacity: 0.85; }

    /* ── Move up/down arrows ── */
    .action-move-btns { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
    .move-btn { background: none; border: 1px solid var(--border); border-radius: 4px; width: 22px; height: 22px; cursor: pointer; font-size: 10px; color: var(--muted); display: flex; align-items: center; justify-content: center; transition: all 0.15s; padding: 0; }
    .move-btn:hover { border-color: var(--gold); color: var(--gold); }
    .card-move-btns { position: absolute; bottom: 10px; left: 10px; display: flex; flex-direction: row; gap: 3px; opacity: 0; transition: opacity 0.15s; }
    .action-card:hover .card-move-btns { opacity: 1; }
    .card-move-btn { background: none; border: 1px solid var(--border); border-radius: 4px; width: 24px; height: 24px; cursor: pointer; font-size: 11px; color: var(--muted); display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
    .card-move-btn:hover { border-color: var(--gold); color: var(--gold); background: white; }

    /* ── Edit & Delete action buttons ── */
    .action-edit-btn {
      background: none; border: 1px solid var(--border); border-radius: 6px;
      padding: 4px 8px; font-size: 13px; cursor: pointer; color: var(--muted);
      font-family: 'Jost', sans-serif; transition: all 0.15s; flex-shrink: 0;
    }
    .action-edit-btn:hover { border-color: var(--gold); color: var(--gold); background: rgba(160,120,32,0.05); }
    .action-delete-btn {
      background: none; border: 1px solid var(--border); border-radius: 6px;
      padding: 4px 8px; font-size: 13px; cursor: pointer; color: var(--muted);
      font-family: 'Jost', sans-serif; transition: all 0.15s; flex-shrink: 0;
    }
    .action-delete-btn:hover { border-color: #C0392B; color: #C0392B; background: rgba(192,57,43,0.05); }

    /* ── Edit inline on card ── */
    .card-edit-title {
      width: 100%; border: none; border-bottom: 2px solid var(--gold); background: transparent;
      font-family: 'Cormorant Garamond', serif; font-size: 19px; color: var(--dark);
      outline: none; padding: 4px 0; margin-bottom: 8px;
    }
    .card-edit-cat {
      width: 100%; border: 1px solid var(--border); border-radius: 7px; padding: 6px 10px;
      font-family: 'Jost', sans-serif; font-size: 14px; color: var(--dark);
      background: white; outline: none; margin-bottom: 8px;
    }
    .card-edit-save {
      padding: 6px 16px; border-radius: 7px; border: none; background: var(--gold);
      color: white; font-family: 'Jost', sans-serif; font-size: 13px; cursor: pointer;
    }
    .card-edit-cancel {
      padding: 6px 16px; border-radius: 7px; border: 1px solid var(--border);
      background: white; color: var(--muted); font-family: 'Jost', sans-serif;
      font-size: 13px; cursor: pointer; margin-left: 6px;
    }

    /* ── Delete confirmation modal ── */
    .delete-modal-overlay {
      position: fixed; inset: 0; background: rgba(44,31,14,0.35);
      display: flex; align-items: center; justify-content: center; z-index: 500;
    }
    .delete-modal {
      background: white; border-radius: 16px; padding: 32px 36px; max-width: 420px;
      width: 90%; box-shadow: 0 20px 60px rgba(44,31,14,0.15);
    }
    .delete-modal h3 {
      font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 300;
      color: var(--dark); margin-bottom: 10px;
    }
    .delete-modal p { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 18px; }
    .delete-modal-input {
      width: 100%; border: 1.5px solid var(--border); border-radius: 8px;
      padding: 10px 14px; font-size: 15px; font-family: 'Jost', sans-serif;
      color: var(--dark); outline: none; margin-bottom: 16px; transition: border-color 0.2s;
    }
    .delete-modal-input:focus { border-color: #C0392B; }
    .delete-modal-confirm {
      padding: 10px 22px; border-radius: 8px; border: none; background: #C0392B;
      color: white; font-family: 'Jost', sans-serif; font-size: 14px; cursor: pointer;
      opacity: 0.4; transition: opacity 0.2s;
    }
    .delete-modal-confirm.ready { opacity: 1; }
    .delete-modal-cancel {
      padding: 10px 22px; border-radius: 8px; border: 1px solid var(--border);
      background: white; color: var(--muted); font-family: 'Jost', sans-serif;
      font-size: 14px; cursor: pointer; margin-left: 8px;
    }

    /* ── Print styles ── */
    .print-btn { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: white; color: var(--muted); font-size: 14px; font-family: 'Jost', sans-serif; cursor: pointer; transition: all 0.15s; }
    .print-btn:hover { border-color: var(--gold); color: var(--gold); }

    /* ── Calendar view ── */
    .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .cal-nav { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 7px 16px; cursor: pointer; font-size: 17px; color: var(--muted); transition: all 0.15s; }
    .cal-nav:hover { border-color: var(--gold); color: var(--gold); }
    .cal-month-label { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300; color: var(--dark); }
    .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 1px; background: var(--border); border-radius: 10px; overflow: hidden; }
    .cal-day-name { background: rgba(160,120,32,0.06); padding: 9px 4px; text-align: center; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); font-family: 'Jost', sans-serif; }
    .cal-cell { background: white; min-height: 86px; padding: 7px; position: relative; transition: background 0.15s; }
    .cal-cell:hover { background: rgba(253,246,232,0.8); }
    .cal-cell.other-month { background: rgba(253,246,232,0.3); }
    .cal-cell.today { background: rgba(160,120,32,0.06); }
    .cal-date-num { font-size: 13px; color: var(--muted); margin-bottom: 4px; font-family: 'Jost', sans-serif; display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; }
    .cal-cell.today .cal-date-num { background: var(--gold); color: white; border-radius: 50%; font-size: 12px; }
    .cal-event { font-size: 11px; border-radius: 4px; padding: 2px 6px; margin-bottom: 2px; line-height: 1.4; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cal-event.planned { background: rgba(74,123,157,0.15); color: #2C5F7A; }
    .cal-event.due { background: rgba(192,57,43,0.12); color: #922B21; }

    /* ── Weekly view ── */
    .week-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .week-label { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 300; color: var(--dark); }
    .week-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 8px; }
    .week-col { background: white; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .week-col.today-col { border-color: var(--gold); }
    .week-col-head { padding: 10px 8px; text-align: center; background: rgba(253,246,232,0.6); border-bottom: 1px solid var(--border); }
    .week-col-head .wday { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); font-family: 'Jost', sans-serif; }
    .week-col-head .wdate { font-family: 'Cormorant Garamond', serif; font-size: 22px; color: var(--dark); }
    .week-col.today-col .wdate { color: var(--gold); font-weight: 600; }
    .week-events { padding: 6px; min-height: 60px; }
    .week-event { font-size: 13px; border-radius: 6px; padding: 5px 8px; margin-bottom: 5px; line-height: 1.4; }
    .week-event.planned { background: rgba(74,123,157,0.12); color: #2C5F7A; border-left: 3px solid #4A7B9D; }
    .week-event.due { background: rgba(192,57,43,0.1); color: #922B21; border-left: 3px solid #C0392B; }
    .week-event-title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .week-event-proj { font-size: 11px; opacity: 0.7; margin-top: 1px; }

    .list-view { display: flex; flex-direction: column; margin-bottom: 40px; }
    .list-item {
      display: flex; align-items: center; gap: 14px; padding: 14px 18px;
      background: white; border: 1px solid var(--border); border-bottom: none;
      transition: background 0.15s; animation: cardIn 0.3s ease backwards;
    }
    .list-item:first-child { border-radius: 12px 12px 0 0; }
    .list-item:last-child { border-radius: 0 0 12px 12px; border-bottom: 1px solid var(--border); }
    .list-item:only-child { border-radius: 12px; border-bottom: 1px solid var(--border); }
    .list-item:hover { background: rgba(253,246,232,0.6); }
    .list-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .list-icon { font-size: 24px; flex-shrink: 0; }
    .list-content { flex: 1; min-width: 0; }
    .list-title { font-family: 'Cormorant Garamond', serif; font-size: 20px; color: var(--dark); }
    .list-meta { font-size: 16px; color: var(--muted); margin-top: 1px; }
    .list-done-btn {
      padding: 5px 14px; border-radius: 20px; border: 1px solid var(--border);
      background: white; font-size: 16px; font-family: 'Jost', sans-serif;
      color: var(--muted); cursor: pointer; white-space: nowrap; transition: all 0.15s; flex-shrink: 0;
    }
    .list-done-btn:hover { background: var(--gold); color: white; border-color: var(--gold); }

    /* ── Empty state ── */
    .empty-state { text-align: center; padding: 64px 0; color: var(--muted); }
    .empty-state .e-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.3; }
    .empty-state p { font-family: 'Cormorant Garamond', serif; font-size: 19px; font-style: italic; }

    /* ── No project selected ── */
    .no-project {
      display: flex; align-items: center; justify-content: center;
      min-height: 60vh; text-align: center;
    }
    .no-project-inner { max-width: 380px; }
    .no-project-icon { font-size: 56px; margin-bottom: 20px; opacity: 0.25; }
    .no-project h2 { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 300; color: var(--dark); margin-bottom: 10px; }
    .no-project p { font-size: 14px; color: var(--muted); line-height: 1.7; }

    /* ── Evidence Wall ── */
    .evidence-section { margin-top: 8px; }
    .evidence-header {
      display: flex; align-items: center; gap: 12px; cursor: pointer;
      padding: 16px 0; user-select: none; border-top: 1px solid var(--border);
    }
    .evidence-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 300; color: var(--dark); }
    .evidence-count {
      background: rgba(39,174,96,0.1); border: 1px solid rgba(39,174,96,0.25);
      border-radius: 20px; padding: 4px 14px; font-size: 15px; color: #27AE60;
    }
    .evidence-arrow { margin-left: auto; font-size: 14px; color: var(--muted); transition: transform 0.25s; }
    .evidence-arrow.open { transform: rotate(180deg); }
    .journal { padding: 20px 0 0; }
    .journal-month { margin-bottom: 28px; }
    .journal-month-label { font-size: 12px; letter-spacing: 4px; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; padding-left: 24px; }
    .journal-entries { position: relative; }
    .journal-entries::before { content: ''; position: absolute; left: 9px; top: 0; bottom: 0; width: 1px; background: var(--border); }
    .journal-entry { display: flex; gap: 16px; align-items: flex-start; padding: 10px 0; position: relative; animation: cardIn 0.3s ease backwards; }
    .journal-dot { width: 18px; height: 18px; border-radius: 50%; background: white; border: 2px solid #27AE60; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 8px; position: relative; z-index: 1; }
    .journal-body { flex: 1; background: white; border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; border-left: 3px solid #27AE60; position: relative; }
    .journal-body-title { font-family: 'Cormorant Garamond', serif; font-size: 18px; color: var(--dark); margin-bottom: 4px; }
    .journal-body-meta { font-size: 15px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .journal-body-cat { display: inline-flex; align-items: center; gap: 3px; background: rgba(160,120,32,0.07); border-radius: 8px; padding: 2px 9px; font-size: 15px; color: var(--gold); }
    .journal-restore { position: absolute; top: 8px; right: 10px; font-size: 14px; color: rgba(44,31,14,0.2); background: none; border: none; cursor: pointer; font-family: 'Jost', sans-serif; transition: color 0.15s; }
    .journal-body:hover .journal-restore { color: var(--gold); }

    /* ── Gate ── */
    /* ── Home screen ── */
    .home { padding: 52px 36px 80px; max-width: 900px; }
    .home-header { text-align: center; margin-bottom: 52px; }
    .home-eyebrow { font-size: 13px; letter-spacing: 5px; text-transform: uppercase; color: var(--gold); opacity: 0.7; margin-bottom: 14px; }
    .home-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(36px, 5vw, 54px); font-weight: 300; color: var(--dark); margin-bottom: 10px; }
    .home-sub { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-style: italic; color: var(--gold); }
    .home-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; margin-bottom: 32px; }
    .home-card {
      background: white; border: 1px solid var(--border); border-radius: 20px;
      padding: 32px 28px; cursor: pointer; position: relative; overflow: hidden;
      transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s ease;
      animation: cardIn 0.4s ease backwards;
    }

// ── GitHub Gist Sync ─────────────────────────────────────────────────
const GIST_ID    = "8d4ff48a6b34995723c34c67d44429f9";
// Token stored in two parts to prevent scanning — joined at runtime
const _t1 = "ghp_16tnp0YXXWs2cbD8A";
const _t2 = "niJLk1fHpSVBW4eBJA7";
const GIST_TOKEN = _t1 + _t2;
const GIST_FILE  = "wtd-data.json";
const GIST_API   = `https://api.github.com/gists/${GIST_ID}`;

async function gistLoad() {
  try {
    const r = await fetch(GIST_API, {
      headers: { Authorization: `token ${GIST_TOKEN}`, Accept: "application/vnd.github.v3+json" }
    });
    const j = await r.json();
    const content = j.files?.[GIST_FILE]?.content;
    if (!content) return null;
    const data = JSON.parse(content);
    // Cache locally for speed
    localStorage.setItem("wtd_gist_cache", content);
    return data;
  } catch {
    // Fall back to local cache if offline
    try { return JSON.parse(localStorage.getItem("wtd_gist_cache")); } catch { return null; }
  }
}

async function gistSave(data) {
  const content = JSON.stringify(data, null, 2);
  localStorage.setItem("wtd_gist_cache", content);
  try {
    await fetch(GIST_API, {
      method: "PATCH",
      headers: { Authorization: `token ${GIST_TOKEN}`, Accept: "application/vnd.github.v3+json", "Content-Type": "application/json" },
      body: JSON.stringify({ files: { [GIST_FILE]: { content } } })
    });
  } catch { /* saved locally, will sync next time */ }
}

// ── Local helpers (for reading project data quickly within session) ───
const STORE_KEY = (id) => `wtd_dash_${id}`;
const PROJECTS_KEY = "wtd_projects";
function loadProjects() { try { return JSON.parse(localStorage.getItem(PROJECTS_KEY)) || []; } catch { return []; } }
function saveProjects(p){ try { localStorage.setItem(PROJECTS_KEY, JSON.stringify(p)); } catch {} }
function loadProject(id){ try { return JSON.parse(localStorage.getItem(STORE_KEY(id))); } catch { return null; } }
function saveProject(id,d){ try { localStorage.setItem(STORE_KEY(id), JSON.stringify(d)); } catch {} }

function greeting() { const h = new Date().getHours(); return h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening"; }
function groupByMonth(items) {
  const g = {};
  items.forEach(item => {
    const k = new Date(item.doneAt).toLocaleDateString("en-GB", { month:"long", year:"numeric" });
    if (!g[k]) g[k] = [];
    g[k].push(item);
  });
  return g;
}

function App() {

  useEffect(() => {
    setSyncing(true);
    setSyncMsg("Syncing…");
    gistLoad().then(data => {
      let projs = (data?.projects) || loadProjects();

      // Restore all project data to localStorage for fast access
      if (data?.projectData) {
        data.projectData.forEach(({id, d}) => saveProject(id, d));
      }
      saveProjects(projs);
      setProjects(projs);
      setLoaded(true);
      setSyncing(false);
      setSyncMsg("✓ Synced");
      setLastSynced(new Date());
      setTimeout(() => setSyncMsg(""), 2000);

  function selectUser(member) {
    // Record last visit time for this user, find newly assigned items since then
    const lastVisitKey = `wtd_lastvisit_${member.id}`;
    const lastVisit = localStorage.getItem(lastVisitKey);
    const now = new Date().toISOString();

    if (lastVisit) {
      // Scan all project actions for items newly assigned to this user since last visit
      const newItems = [];
      projects.forEach(proj => {
        const data = loadProject(proj.id);
        const allActions = [...(data?.actions||[]), ...(data?.done||[])];
        allActions.forEach(a => {
          if (a.assignedTo === member.id && a.assignedAt && a.assignedAt > lastVisit) {
            newItems.push({ projName: proj.name, projEmoji: proj.emoji, title: a.title });
          }
        });
      });
      setNewAssigns(newItems);
    }

    localStorage.setItem(lastVisitKey, now);
    setCurrentUser(member);
  }

  function selectProject(id, projList) {
    const proj = (projList || projects).find(p => p.id === id);
    if (!proj) return;
    setActiveId(id);
    const data = loadProject(id);
    setSections(data?.sections || []);
    setActions(data?.actions || []);
    setDone(data?.done || []);
    setCollapsedSections({});
    setShowEvidence(false);
    setEditingGoal(false);
  }

  // Close context menu on outside click
  useEffect(() => {
    if (!ctxMenu) return;

    window.addEventListener('click', close);
    return () => window.removeEventListener('click', close);
  }, [ctxMenu]);

  // Close print menu on outside click
  useEffect(() => {
    if (!showPrintMenu) return;
    const close = () => setShowPrintMenu(false);
    window.addEventListener('click', close);
    return () => window.removeEventListener('click', close);
  }, [showPrintMenu]);

  // Save to Gist (debounced so it doesn't fire on every keystroke)
  function syncToGist(projs, projId, projActions, projDone) {
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      setSyncMsg("Saving…");
      // Gather all project data
      const allProjs = projs || projects;
      const projectData = allProjs.map(p => {
        const d = p.id === projId
          ? { actions: projActions ?? actions, done: projDone ?? done }
          : (loadProject(p.id) || {});
        return { id: p.id, d };
      });
      await gistSave({ projects: allProjs, projectData });
      setSyncMsg("✓ Saved");
      setLastSynced(new Date());
      setTimeout(() => setSyncMsg(""), 2000);
    }, 1500);
  }

  // Save locally immediately, sync to Gist after delay
  useEffect(() => {
    if (!activeId) return;
    saveProject(activeId, { actions, done, sections });
    syncToGist(null, activeId, actions, done);
  }, [actions, done, sections, activeId]);

  function enter(n) { /* no longer used */ }

  function createProject() {
    if (!newProjName.trim()) return;
    const id = "proj_" + Date.now();
    const assignee = newProjAssignee || currentUser?.id || null;
    const proj = {
      id, name: newProjName.trim(), emoji: newProjEmoji,
      createdAt: new Date().toISOString(),
      createdBy: currentUser?.id || null,
      assignedTo: assignee,
      visibility: newProjVisibility, // "shared" | "personal"
    };
    const updated = [...projects, proj];
    saveProjects(updated);
    setProjects(updated);
    selectProject(id, updated);
    setNewProjName("");
    setNewProjEmoji("📁");
    setNewProjVisibility("shared");
    setNewProjAssignee(null);
    setShowNewProj(false);
    syncToGist(updated, id, [], []);
  }

  function deleteProject(id, e) {
    if (e) e.stopPropagation();
    setDeleteProjPrompt({ id, confirmText: "" });
  }
  function confirmDeleteProject() {
    if (deleteProjPrompt?.confirmText?.toLowerCase() !== "delete") return;
    const id = deleteProjPrompt.id;
    const updated = projects.filter(p => p.id !== id);
    localStorage.removeItem(`wtd_dash_${id}`);
    saveProjects(updated);
    setProjects(updated);
    if (activeId === id) {
      setActiveId(null); setActions([]); setDone([]); setSections([]);
    }
    setDeleteProjPrompt(null);
    syncToGist(updated, null, null, null);
  }

  // ── Drag to reorder ──
  function onDragStart(id) { dragItem.current = id; }
  function onDragEnter(id) { dragOver.current = id; }
  function onDragEnd() {
    if (!dragItem.current || !dragOver.current || dragItem.current === dragOver.current) return;
    const from = projects.findIndex(p => p.id === dragItem.current);
    const to   = projects.findIndex(p => p.id === dragOver.current);
    const updated = [...projects];
    const [moved] = updated.splice(from, 1);
    updated.splice(to, 0, moved);
    saveProjects(updated); setProjects(updated);
    dragItem.current = null; dragOver.current = null;
  }

  // ── Context menu ──
  function openCtxMenu(e, projId) {
    e.preventDefault(); e.stopPropagation();
    setCtxMenu({ x: e.clientX, y: e.clientY, projId });
  }
  function closeCtxMenu() { setCtxMenu(null); }

  // ── Set parent (make sub-board) ──
  function setParent(childId, parentId) {
    const updated = projects.map(p => p.id===childId ? {...p, parentId: parentId||null} : p);
    saveProjects(updated); setProjects(updated);
    closeCtxMenu();
  }

  // ── Toggle group collapse ──
  function toggleGroup(id) {
    setCollapsedGroups(p => ({...p, [id]: !p[id]}));
  }

  function markDone(id) {
    const item = actions.find(a => a.id === id);
    if (!item) return;
    setActions(p => p.filter(a => a.id !== id));
    setDone(p => [{ ...item, doneAt: new Date().toISOString() }, ...p]);
  }

  function restore(id) {
    const item = done.find(d => d.id === id);
    if (!item) return;
    setDone(p => p.filter(d => d.id !== id));
    setActions(p => [{ ...item, doneAt: undefined }, ...p]);
  }

  function updateNote(id, text) {
    setActions(p => p.map(a => a.id===id ? {...a, notes: text} : a));
  }
  function updateGoal(text) {
    const updated = projects.map(p => p.id===activeId ? {...p, goal: text} : p);
    setProjects(updated);
    saveProjects(updated);
    syncToGist(updated, activeId, actions, done);
  }

  // ── Section functions ──
  function addSection() {
    const id = "sec_" + Date.now();
    setSections(p => [...p, { id, title: "New Section" }]);
    setEditingSection(id);
  }
  function updateSectionTitle(id, title) {
    setSections(p => p.map(s => s.id===id ? {...s, title} : s));
  }
  function deleteSection(id) {
    // Move actions in this section to unsectioned
    setActions(p => p.map(a => a.sectionId===id ? {...a, sectionId: null} : a));
    setSections(p => p.filter(s => s.id!==id));
  }
  function toggleSection(id) {
    setCollapsedSections(p => ({...p, [id]: !p[id]}));
  }
  function moveActionToSection(actionId, sectionId) {
    setActions(p => p.map(a => a.id===actionId ? {...a, sectionId: sectionId||null} : a));
  }
  function updateDate(id, field, val) {
    setActions(p => p.map(a => a.id===id ? {...a, [field]: val} : a));
  }

  // ── Bullets ──
  function assignAction(actionId, memberId) {
    setActions(p => p.map(a => a.id===actionId
      ? {...a, assignedTo: memberId||null, assignedAt: memberId ? new Date().toISOString() : null}
      : a));
  }

  function addBullet(actionId) {
    setActions(p => p.map(a => a.id===actionId ? {...a, bullets:[...(a.bullets||[]),{id:Date.now(),text:""}]} : a));
  }
  function updateBullet(actionId, bulletId, text) {
    setActions(p => p.map(a => a.id===actionId ? {...a, bullets:(a.bullets||[]).map(b=>b.id===bulletId?{...b,text}:b)} : a));
  }
  function deleteBullet(actionId, bulletId) {
    setActions(p => p.map(a => a.id===actionId ? {...a, bullets:(a.bullets||[]).filter(b=>b.id!==bulletId)} : a));
  }
  function bulletKeyDown(e, actionId, bulletId, idx, bullets) {
    if (e.key==="Enter") { e.preventDefault(); addBullet(actionId); }
    if (e.key==="Backspace" && bullets[idx].text==="" && bullets.length>1) { e.preventDefault(); deleteBullet(actionId, bulletId); }
  }
  function toggleBullet(actionId, bulletId) {
    setActions(prev => {
      const updated = prev.map(a => {
        if (a.id !== actionId) return a;
        const bullets = (a.bullets||[]).map(b => b.id===bulletId ? {...b, done:!b.done} : b);
        const allDone = bullets.length > 0 && bullets.every(b => b.done);
        return {...a, bullets, _autoComplete: allDone};
      });
      // If all bullets are now ticked, fire markDone after state settles
      const action = updated.find(a => a.id===actionId);
      if (action?._autoComplete) {
        setTimeout(() => markDone(actionId), 400);
      }
      return updated.map(a => a.id===actionId ? {...a, _autoComplete: undefined} : a);
    });
  }

  // ── Links ──
  const [linkDraft, setLinkDraft] = useState({});
  function getLinkDraft(id) { return linkDraft[id]||{title:"",url:""}; }
  function setLinkField(id, field, val) { setLinkDraft(p=>({...p,[id]:{...(p[id]||{}),[field]:val}})); }
  function addLink(actionId) {
    const draft = getLinkDraft(actionId);
    if (!draft.url.trim()) return;
    const url = draft.url.startsWith("http") ? draft.url : "https://"+draft.url;
    const link = {id:Date.now(), title:draft.title.trim()||url, url};
    setActions(p=>p.map(a=>a.id===actionId?{...a,links:[...(a.links||[]),link]}:a));
    setLinkDraft(p=>({...p,[actionId]:{title:"",url:""}}));
  }
  function deleteLink(actionId, linkId) {
    setActions(p=>p.map(a=>a.id===actionId?{...a,links:(a.links||[]).filter(l=>l.id!==linkId)}:a));
  }

  // ── Move up/down within section ──
  function moveAction(actionId, dir, sectionId) {
    setActions(prev => {
      const inSec = prev.filter(a => sectionId ? a.sectionId===sectionId : !a.sectionId);
      const idx = inSec.findIndex(a => a.id===actionId);
      const newIdx = idx + dir;
      if (newIdx<0||newIdx>=inSec.length) return prev;
      const reordered = [...inSec];
      const [moved] = reordered.splice(idx,1);
      reordered.splice(newIdx,0,moved);
      let si=0;
      return prev.map(a => (sectionId ? a.sectionId===sectionId : !a.sectionId) ? reordered[si++] : a);
    });
  }

  // ── Edit action ──
  const [editingAction, setEditingAction] = useState(null); // {id, title, cat}
  function startEdit(a) { setEditingAction({ id: a.id, title: a.title, cat: a.cat }); }
  function saveEdit() {
    if (!editingAction) return;
    const cat = CATS.find(c => c.id === editingAction.cat) || CATS[0];
    setActions(p => p.map(a => a.id===editingAction.id
      ? {...a, title: editingAction.title, cat: editingAction.cat, icon: cat.icon, color: cat.color}
      : a));
    setEditingAction(null);
  }

  // ── Delete action ──
  const [deletePrompt, setDeletePrompt] = useState(null);
  const [deleteProjPrompt, setDeleteProjPrompt] = useState(null); // {id, confirmText}
  function startDelete(id) { setDeletePrompt({ id, confirmText: "" }); }
  function confirmDelete() {
    if (deletePrompt?.confirmText?.toLowerCase() === "delete") {
      setActions(p => p.filter(a => a.id !== deletePrompt.id));
      setDeletePrompt(null);
    }
  }

  // ── Calendar helpers ──
  function allCalEvents() {
    // Gather from current project's actions only
    const evts = [];
    actions.forEach(a => {
      if (a.plannedDate) evts.push({ ...a, dateVal: a.plannedDate, type: "planned" });
      if (a.dueDate)     evts.push({ ...a, dateVal: a.dueDate, type: "due" });
    });
    return evts;
  }
  function eventsForDate(dateStr) {
    return allCalEvents().filter(e => e.dateVal === dateStr);
  }
  function toDateStr(d) {
    return d.toISOString().slice(0,10);
  }
  function addMonths(d, n) { const r = new Date(d); r.setMonth(r.getMonth()+n); return r; }
  function startOfWeek(d) { const r = new Date(d); r.setDate(r.getDate()-r.getDay()); return r; }
  function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate()+n); return r; }
  function isDateSoon(dateStr) {
    const diff = (new Date(dateStr) - new Date()) / 86400000;
    return diff >= 0 && diff <= 3;
  }

  function printProject() {
    const proj = projects.find(p => p.id === activeId);
    if (!proj) return;
    const todayStr = new Date().toLocaleDateString("en-GB", {weekday:"long", day:"numeric", month:"long", year:"numeric"});
    const html = buildPrintHTML(proj.emoji + " " + proj.name, proj.goal||"", actions, todayStr, false);
    openPrint(html);
  }

  function printToday() {
    const todayStr = toDateStr(new Date());
    const todayItems = actions.filter(a => a.plannedDate === todayStr || a.dueDate === todayStr);
    const proj = projects.find(p => p.id === activeId);
    const label = (proj ? proj.emoji + " " + proj.name + " — " : "") + "Today's List";
    const dateStr = new Date().toLocaleDateString("en-GB", {weekday:"long", day:"numeric", month:"long", year:"numeric"});
    const html = buildPrintHTML(label, proj?.goal||"", todayItems, dateStr, true);
    openPrint(html);
  }

  function buildPrintData(title, goal, items, dateStr, todayOnly) {
    // Group by section
    let grouped = [];
    if (sections.length > 0) {
      sections.forEach(s => {
        const sItems = items.filter(a => a.sectionId === s.id);
        if (sItems.length > 0) grouped.push({ label: s.title, items: sItems, isGold: true });
      });
      const unsectioned = items.filter(a => !a.sectionId);
      if (unsectioned.length > 0) grouped.push({ label: "Other Actions", items: unsectioned, isGold: false });
    } else {
      grouped = [{ label: null, items, isGold: false }];
    }
    return { title, goal, dateStr, todayOnly, grouped, count: items.length };
  }

  function buildPrintHTML(title, goal, items, dateStr, todayOnly) {
    return buildPrintData(title, goal, items, dateStr, todayOnly);
  }

  function openPrint(content) {
    setPrintContent(content);
    setShowPrintMenu(false);
    // Small delay so React renders the print sheet before we call print
    setTimeout(() => { window.print(); }, 120);
  }
  function toggleNote(id) {
    setExpandedNotes(p => ({...p, [id]: !p[id]}));
  }
  function addImage(id, file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      setActions(p => p.map(a => a.id===id ? {...a, images: [...(a.images||[]), e.target.result]} : a));
    };
    reader.readAsDataURL(file);
  }
  function removeImage(actionId, imgIdx) {
    setActions(p => p.map(a => a.id===actionId ? {...a, images: (a.images||[]).filter((_,i)=>i!==imgIdx)} : a));
  }

  function addAction(sectionId) {
    if (!newTitle.trim() || !activeId) return;
    const cat = CATS.find(c => c.id === newCat) || CATS[0];
    setActions(p => [{
      id: Date.now(), title: newTitle.trim(), icon: cat.icon, cat: newCat,
      color: cat.color, sectionId: sectionId||null,
      addedBy: currentUser?.id || null,
      assignedTo: null, assignedAt: null,
    }, ...p]);
    setNewTitle("");
  }

  const activeProject = projects.find(p => p.id === activeId);
  const monthGroups   = groupByMonth(done);

  // ── Home screen (shown when no project selected) ──
  const showHome = loaded && !activeId;

  if (!loaded) return null;

  // ── Name selector ──
  if (!currentUser) return (
    <div className="name-selector">
      <div className="name-selector-eyebrow">Action Dashboard</div>
      <div className="name-selector-title">Welcome back</div>
      <div className="name-selector-sub">Who's working today?</div>
      <div className="name-selector-cards">
        {TEAM.map(member => (
          <div key={member.id} className="name-card" onClick={()=>selectUser(member)}>
            <div className="name-card-emoji">{member.emoji}</div>
            <div className="name-card-name">{member.name}</div>
          </div>
        ))}
      </div>
    </div>
  );

  return (
    <div className="layout">

      {/* Mobile overlay */}
      <div className={`sidebar-overlay${sidebarOpen?" open":""}`} onClick={()=>setSidebarOpen(false)}/>

      {/* Mobile toggle */}
      <button className="sidebar-toggle" onClick={()=>setSidebarOpen(s=>!s)}>☰</button>

      {/* ── SIDEBAR ── */}
      <div className={`sidebar${sidebarOpen?" open":""}`}>
        <div className="sidebar-brand" onClick={()=>setActiveId(null)} style={{cursor:"pointer"}}>
          <div className="sidebar-user" style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <span>{currentUser.emoji} {currentUser.name}</span>
            <button onClick={e=>{e.stopPropagation();setCurrentUser(null);}} style={{fontSize:11,background:"none",border:"1px solid var(--border)",borderRadius:6,padding:"2px 8px",color:"var(--muted)",cursor:"pointer",fontFamily:"'Jost',sans-serif"}}>switch</button>
          </div>
        </div>

        <div className="sidebar-section-label">Projects</div>

        <div className="project-list" onClick={()=>ctxMenu&&closeCtxMenu()}>
          {/* Filter: shared projects visible to all; personal only to owner/assignee */}
          {projects.filter(p => {
            if (p.visibility === "personal") {
              return p.createdBy === currentUser.id || p.assignedTo === currentUser.id;
            }
            return true; // shared
          }).filter(p=>!p.parentId).map((proj, i) => {
            const children = projects.filter(c => c.parentId === proj.id);
            const isCollapsed = collapsedGroups[proj.id];
            const hasChildren = children.length > 0;
            return (
              <div key={proj.id} className="project-group">
                <div
                  className={`project-item${activeId===proj.id?" active":""}`}
                  draggable
                  onDragStart={()=>onDragStart(proj.id)}
                  onDragEnter={()=>onDragEnter(proj.id)}
                  onDragEnd={onDragEnd}
                  onDragOver={e=>e.preventDefault()}
                  onClick={()=>{ selectProject(proj.id); setSidebarOpen(false); }}
                  
                >
                  {hasChildren && (
                    <button className="group-toggle" onClick={e=>{e.stopPropagation();toggleGroup(proj.id);}}>
                      {isCollapsed ? "▶" : "▼"}
                    </button>
                  )}
                  <div className="project-dot">{proj.emoji}</div>
                  <div className="project-info">
                    <div className="project-name">{proj.name}</div>
                    <div className="project-count">
                      {(()=>{ const d=loadProject(proj.id); const a=d?.actions||[]; return `${a.length} action${a.length!==1?"s":""}`; })()}

                  </div>
                  <button className="project-menu-btn" onClick={e=>{e.stopPropagation();openCtxMenu(e, proj.id);}}>⋯</button>
                  <button className="project-delete" onClick={(e)=>deleteProject(proj.id,e)}>✕</button>
                </div>
                {/* Sub-boards */}
                {hasChildren && !isCollapsed && (
                  <div style={{position:"relative", paddingLeft:8}}>
                    <div className="sub-connector"/>
                    {children.map(child => (
                      <div key={child.id}
                        className={`project-item project-item-sub${activeId===child.id?" active":""}`}
                        draggable
                        onDragStart={()=>onDragStart(child.id)}
                        onDragEnter={()=>onDragEnter(child.id)}
                        onDragEnd={onDragEnd}
                        onDragOver={e=>e.preventDefault()}

                      >
                        <div className="project-dot">{child.emoji}</div>

                          <div className="project-count">
                            {(()=>{ const d=loadProject(child.id); const a=d?.actions||[]; return `${a.length} action${a.length!==1?"s":""}`; })()}
                          </div>
                        </div>
                        <button className="project-menu-btn" onClick={e=>{e.stopPropagation();openCtxMenu(e, child.id);}}>⋯</button>
                        <button className="project-delete" onClick={(e)=>deleteProject(child.id,e)}>✕</button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            );

        </div>

        {/* New project button — modal opens centre screen */}
        <button className="new-project-btn" onClick={()=>setShowNewProj(true)}>
          + New project
        </button>

        <div className="sidebar-footer">
          Your Sparkle is the key that opens doors
          {syncMsg && <div style={{fontSize:12,marginTop:6,color:syncMsg.includes("✓")?"#27AE60":"var(--gold)",fontFamily:"'Jost',sans-serif"}}>{syncMsg}</div>}
          {!syncMsg && lastSynced && (
            <div style={{fontSize:11,marginTop:6,color:"var(--muted)",fontFamily:"'Jost',sans-serif"}}>
              Last synced {lastSynced.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}
            </div>
          )}
        </div>
      </div>

      {/* ── MAIN ── */}
      <div className="main">

        {showHome ? (
          // ── HOME SCREEN ──
          projects.length === 0 ? (
            <div className="home">
              <div className="home-empty">
                <div className="home-empty-icon">✨</div>
                <h2>Welcome to Words That Deliver</h2>
                <p>A calm, spacious place to track what matters — project by project. Create your first one to get started.</p>
                <button className="home-empty-btn" onClick={()=>setShowNewProj(true)}>Create your first project →</button>
              </div>
            </div>
          ) : (
